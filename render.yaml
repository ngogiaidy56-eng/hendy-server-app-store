services:
  - type: web
    name: hendy-server-app-store
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: Hendy App Store
      - key: ENVIRONMENT
        value: production
      - key: RELEASE_CHANNEL
        value: stable
      - key: ALLOW_DEGRADED_START
        value: "true"
      - key: PGPOOL_MAX
        value: "3"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: RELEASE_PUBLISH_TOKEN
        sync: false
      - key: CERTIFICATE_ENCRYPTION_KEY
        sync: false
