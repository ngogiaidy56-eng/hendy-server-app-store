name: Deploy Hendy App Store to Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'admin.html'
      - 'package.json'
      - 'wrangler*.toml'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'scripts/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hendy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify, provision and deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCESS_ADMIN_EMAILS: ${{ vars.CF_ACCESS_ADMIN_EMAILS || secrets.CF_ACCESS_ADMIN_EMAILS }}
      RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
      CLOUDFLARE_WORKER_NAME: hendy-tool-releas
      WORKER_HOST: hendy-tool-releas.ngogiaidy56.workers.dev
      APP_BASE_URL: https://hendy-tool-releas.ngogiaidy56.workers.dev

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Cloudflare deployment settings
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN in GitHub Actions secrets."
            exit 1
          fi
          if ! [[ "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::Set CLOUDFLARE_ACCOUNT_ID as a GitHub Actions variable or secret."
            exit 1
          fi
          if [ -z "${CF_ACCESS_ADMIN_EMAILS:-}" ]; then
            echo "::error::Set CF_ACCESS_ADMIN_EMAILS to one or more real administrator emails."
            exit 1
          fi
          echo "Required deployment settings are present; secret values are not printed."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check and unit tests
        run: |
          npm run lint
          npm test

      - name: Build Store and Admin for Worker Static Assets
        run: |
          npm run build
          node scripts/verify-store-admin-build.mjs
          test -s dist/index.html
          test -s dist/admin.html
          test -s .worker-dist/index.html
          test -s .worker-dist/admin.html

      - name: Ensure Cloudflare R2 release bucket exists
        run: node scripts/provision-cloudflare-resources.mjs

      - name: Bootstrap Worker
        run: npx --yes wrangler@4 deploy --config=wrangler.bootstrap.toml

      - name: Provision Cloudflare Access and generate temporary Worker secrets
        id: access
        run: node scripts/provision-cloudflare-access.mjs --output "$RUNNER_TEMP/worker-secrets.json"

      - name: Deploy production Worker with required secrets
        run: npx --yes wrangler@4 deploy --config=wrangler.toml --secrets-file "${{ steps.access.outputs.secrets_file }}"

      - name: Smoke-test deployed Worker
        run: npm run smoke:cloudflare

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Hendy App Store — Cloudflare Worker"
            echo
            echo "- Worker: https://hendy-tool-releas.ngogiaidy56.workers.dev/"
            echo "- Store: /"
            echo "- Admin (Cloudflare Access protected): /admin"
            echo "- Health: /healthz"
            echo "- Runtime readiness: /api/v1/runtime/readiness"
            echo "- Deployment status: ${{ job.status }}"
            echo "- Artifact downloads require the real package files to be present in R2."
          } >> "$GITHUB_STEP_SUMMARY"
