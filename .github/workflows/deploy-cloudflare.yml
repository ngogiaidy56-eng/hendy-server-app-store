name: Deploy Cloudflare API Worker
on:
  push:
    branches: [main]
    paths: ["worker/**", "wrangler.toml", ".github/workflows/deploy-cloudflare.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ vars.RENDER_API_ORIGIN != '' && vars.ALLOWED_ORIGIN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require Cloudflare credentials
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' || secrets.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy edge proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RENDER_API_ORIGIN: ${{ vars.RENDER_API_ORIGIN }}
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
        run: |
          npx --yes wrangler@4 deploy worker/index.ts \
            --name hendy-server-app-store-api \
            --compatibility-date 2026-10-20 \
            --var "RENDER_API_ORIGIN:$RENDER_API_ORIGIN" \
            --var "ALLOWED_ORIGIN:$ALLOWED_ORIGIN"