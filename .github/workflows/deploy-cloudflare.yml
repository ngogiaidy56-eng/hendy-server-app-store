name: Deploy Cloudflare Worker API
on:
  push:
    branches: [main]
    paths: ["worker/**", "wrangler.toml", "migrations/**", "package.json", "package-lock.json", ".github/workflows/deploy-cloudflare.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-cloudflare-api
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.configured == 'true'
        with:
          node-version: 22
      - run: npm install
        if: steps.credentials.outputs.configured == 'true'
      - name: Deploy Worker
        if: steps.credentials.outputs.configured == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Explain skipped deployment
        if: steps.credentials.outputs.configured != 'true'
        run: echo "::warning::Skipped Worker deployment because CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID is not configured in GitHub Actions Secrets."
