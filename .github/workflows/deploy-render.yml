name: Optional Render Web Service deployment

# This repository targets Cloudflare Workers & Pages by default.
# Render deployment remains manual so a Render hook cannot be mistaken for Cloudflare deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optional-render-deployment
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    name: Build & optionally trigger Render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Verify frontend build
        run: npm run build

      - name: Trigger Render deploy hook if configured
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured; verification completed without triggering Render."
            exit 0
          fi
          curl --fail --show-error --silent -X POST "$RENDER_DEPLOY_HOOK_URL"
