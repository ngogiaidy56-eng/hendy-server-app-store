name: Build and publish Hendy web release (Render)

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release version, for example 3.3.1
        required: true
        type: string
      notes:
        description: Release notes shown in the app store
        required: true
        default: Web improvements and bug fixes.
        type: string
      publish_to_store:
        description: Publish the actual ZIP to the Render app store
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_NOTES: ${{ inputs.notes }}

jobs:
  build-package:
    name: Build and package the actual web app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production website
        run: npm run build

      - name: Package website and calculate checksums
        run: npm run package:web-release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: hendy-store-web-${{ env.RELEASE_VERSION }}
          path: |
            release-artifacts/hendy-store-web-v${{ env.RELEASE_VERSION }}.zip
            release-artifacts/hendy-store-web-v${{ env.RELEASE_VERSION }}.zip.sha256
            release-artifacts/release-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate publisher configuration
        if: ${{ inputs.publish_to_store }}
        env:
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          HENDY_APP_URL: ${{ vars.HENDY_APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HENDY_APP_URL:-}" ]; then
            echo "::error::Set HENDY_APP_URL in repository Actions variables to the live Render service URL."
            exit 1
          fi
          if [ "${#RELEASE_PUBLISH_TOKEN}" -lt 32 ]; then
            echo "::error::Configure RELEASE_PUBLISH_TOKEN as a repository Actions secret."
            exit 1
          fi

      - name: Publish ZIP to Render API
        if: ${{ inputs.publish_to_store }}
        env:
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          HENDY_APP_URL: ${{ vars.HENDY_APP_URL }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "${HENDY_APP_URL%/}/api/v1/ci/publish" \
            -H "Authorization: Bearer $RELEASE_PUBLISH_TOKEN" \
            -F "appName=Hendy Store Web" \
            -F "appSlug=hendy-store-web" \
            -F "version=$RELEASE_VERSION" \
            -F "platform=web" \
            -F "releaseNotes=$RELEASE_NOTES" \
            -F "file=@release-artifacts/hendy-store-web-v$RELEASE_VERSION.zip;type=application/zip" \
            --output publish-result.json
          cat publish-result.json
