name: Verify and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund
      - name: Typecheck every workspace and Worker
        run: npm run typecheck
      - name: Run API, Worker and package tests
        run: npm test
      - name: Build storefront, admin, Control Plane and Studio
        run: npm run build
