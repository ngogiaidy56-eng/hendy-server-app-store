name: CI - Hendy App Store (Render)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hendy-render-ci
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, test and build Render service
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build Store, Admin and Render server
        run: npm run build
