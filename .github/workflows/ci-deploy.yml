name: CI - Hendy App Store

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hendy-pages-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, test, verify Pages functions and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Unit and Pages Functions tests
        run: npm test

      - name: Build multi-page Store and Admin
        run: npm run build

      - name: Verify Cloudflare Pages deployment shape
        run: node automation/verify-build.mjs
