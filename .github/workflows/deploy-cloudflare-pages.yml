name: Deploy Cloudflare Pages Frontend

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "public/**"
      - "index.html"
      - "admin.html"
      - "app-routes.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check Cloudflare Pages configuration
        id: config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_PAGES_PROJECT" && -n "$VITE_API_BASE_URL" ]]; then
            node --input-type=module -e 'const u=new URL(process.env.VITE_API_BASE_URL); if(u.protocol!=="https:" || u.pathname!=="/" || u.search || u.hash || u.username || u.password) { console.error("VITE_API_BASE_URL must be an HTTPS origin without path/query."); process.exit(1); }'
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Pages deployment skipped. Set secrets CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID and variables CLOUDFLARE_PAGES_PROJECT/VITE_API_BASE_URL."
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.config.outputs.configured == 'true'
        run: npm install --include=dev --no-audit --no-fund
      - name: Typecheck and test
        if: steps.config.outputs.configured == 'true'
        run: npm run typecheck && npm test
      - name: Build every UI entry
        if: steps.config.outputs.configured == 'true'
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - name: Deploy Cloudflare Pages
        if: steps.config.outputs.configured == 'true'
        run: npx wrangler pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
