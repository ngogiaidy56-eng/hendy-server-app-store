# Canonical production Worker configuration used by the GitHub Actions deployment.
# Keep the Worker name exactly "hendy-tool-releas" to retain its workers.dev URL.
name = "hendy-tool-releas"
main = "./src/worker.ts"
compatibility_date = "2026-10-23"
workers_dev = true

[assets]
directory = "./.worker-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/", "/api/*", "/health", "/healthz", "/admin*", "/studio*"]

[vars]
ENVIRONMENT = "production"
APP_NAME = "Hendy Tools Platform & App Downloader"
PUBLIC_BASE_URL = "https://hendytools.pages.dev"
RELEASE_CHANNEL = "stable"
CLOUDFLARE_PAGES_DOMAIN = "hendytools.pages.dev"
R2_BUCKET_NAME = "hendy-tool-releases"

[[r2_buckets]]
binding = "RELEASES_BUCKET"
bucket_name = "hendy-tool-releases"

[secrets]
required = ["CF_ACCESS_TEAM_DOMAIN", "CF_ACCESS_AUD", "CF_ACCESS_ADMIN_EMAILS"]
