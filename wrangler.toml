# Canonical Cloudflare Pages configuration template.
# Account-specific D1 / KV IDs are provisioned and written to ignored
# wrangler.generated.jsonc by automation/provision-cloudflare-resources.mjs.
name = "hendy-app-store"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-26"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_NAME = "Hendy App Store"
ENVIRONMENT = "development"
PUBLIC_BASE_URL = "https://hendy-app-store.pages.dev"
RELEASE_CHANNEL = "stable"
R2_BUCKET_NAME = "hendy-tool-releases"
D1_DATABASE_NAME = "hendy-app-store-db"

# Do not hard-code account-specific resource IDs in this template.
# The generated production config binds:
#   DB         -> Cloudflare D1 hendy-app-store-db
#   RELEASES   -> Cloudflare R2 hendy-tool-releases
#   RATE_LIMITS -> Cloudflare KV hendy-app-store-rate-limits
